[project]
name = "vqa-chest"
version = "0.1.0"
description = "Analyzing a public VQA medical dataset from huggingface and develop a VQA model with good metrics"
readme = "README.md"
authors = [
    { name = "Naif Ganadily", email = "nganadil@asu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "grad-cam>=1.5.5",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch==2.*",
    "torchvision>=0.26.0",
    "transformers>=5.5.4",
    "wandb>=0.26.1",
]

[project.scripts]
train = "entrypoint.train:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta" 

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "entrypoint*"]

[tool.uv.sources]
vqa-chest = { workspace = true }