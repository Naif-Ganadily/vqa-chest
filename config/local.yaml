# Configuration for streamlining the training
# Experiment tracking -- switch backend here, no code changes needed.
tracker:
  backend: "mlflow"       # wandb | mlflow | none
  project: "vqa-chest"   # W&B project / MLflow experiment name
  tracking_uri: ""       # mlflow only; "" -> local private SQLite (mlflow.db)
run_name: "local-run"
dataset: "flaviagiammarino/vqa-rad"
batch_size: 8
lr: 0.001
epochs: 10
seed: 42
device: "cuda"
img_size: 224
max_text_len: 32
text_emb_dim: 768
text_model_id: "distilbert-base-uncased"
checkpoint_dir: "data/05-models"
predictions_dir: "data/04-predictions"