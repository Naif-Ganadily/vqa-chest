# Experiment tracking -- private by default (self-hostable MLflow).
tracker:
  backend: "mlflow"      # wandb | mlflow | none
  project: "vqa-chest"   # MLflow experiment name
  tracking_uri: ""       # "" -> local SQLite; or on-prem DB/server (postgresql://... , http://mlflow.internal:5000)
run_name: "prod-run"
dataset: "flaviagiammarino/vqa-rad"
batch_size: 16
lr: 1e-3
epochs: 10
seed: 42
device: "cuda"
img_size: 224
max_text_len: 32
text_emb_dim: 768
text_model_id: "distilbert-base-uncased"
checkpoint_dir: "data/05-models"
predictions_dir: "data/04-predictions"